<!DOCTYPE html>
<html>

<head>
<title>My Tickets</title>
</head>

<body>


<h1>
My Tickets
</h1>


{% for ticket in tickets %}

<hr>


<h3>
{{ ticket.title }}
</h3>


<p>
Category:
{{ ticket.category }}
</p>


<p>
Priority:
{{ ticket.priority }}
</p>


<p>
Status:
{{ ticket.status }}
</p>


<p>
Created:
{{ ticket.created_at }}
</p>


{% empty %}

<p>
No tickets created yet.
</p>


{% endfor %}


<a href="/tickets/create/">
Create New Ticket
</a>


</body>

</html>
