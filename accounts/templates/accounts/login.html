<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Smart Ticketing - Login</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">



<style>


body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(135deg,#2563eb,#4f46e5);

    font-family:'Segoe UI',sans-serif;

}



.login-card{

    width:420px;

    border:none;

    border-radius:25px;

    overflow:hidden;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.25);

}



.login-header{

    background:white;

    text-align:center;

    padding:35px 25px 20px;

}



.logo{

    width:80px;
    height:80px;

    background:#2563eb;

    color:white;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:auto;

    font-size:35px;

}



.login-header h2{

    margin-top:20px;

    font-weight:700;

    color:#1e293b;

}



.login-header p{

    color:#64748b;

}



.login-body{

    background:white;

    padding:30px;

}



.form-control{

    height:50px;

    border-radius:12px;

}



.input-group-text{

    background:#2563eb;

    color:white;

    border:none;

}



.btn-login{

    height:50px;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:18px;

    font-weight:600;

    border:none;

}



.btn-login:hover{

    background:#1d4ed8;

    color:white;

}



.ai-feature{

    margin-top:25px;

    padding:15px;

    border-radius:15px;

    background:#eff6ff;

    color:#1e40af;

    font-size:14px;

}



.register-link{

    text-align:center;

    margin-top:20px;

}



.register-link a{

    color:#2563eb;

    font-weight:bold;

    text-decoration:none;

}



</style>


</head>



<body>



<div class="card login-card">


<!-- Header -->


<div class="login-header">


<div class="logo">

<i class="bi bi-robot"></i>

</div>


<h2>

Welcome Back

</h2>


<p>

AI Smart Ticketing System

</p>



</div>




<!-- Login Form -->


<div class="login-body">


{% if error %}

<div class="alert alert-danger">

{{error}}

</div>

{% endif %}



<form method="POST">


{% csrf_token %}



<div class="mb-3">


<label class="form-label">

Username

</label>


<div class="input-group">


<span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>


<input 
type="text"
name="username"
class="form-control"
placeholder="Enter username"
required>


</div>


</div>





<div class="mb-4">


<label class="form-label">

Password

</label>


<div class="input-group">


<span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>


<input 
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>


</div>


</div>





<button class="btn btn-login w-100">


<i class="bi bi-box-arrow-in-right"></i>

Login


</button>



</form>





<div class="ai-feature">


🤖 <b>AI Powered Support</b>

<br>

Manage tickets, analyze issues and get intelligent responses.


</div>





<div class="register-link">


Don't have an account?

<a href="/accounts/register/">

Create Account

</a>


</div>



</div>



</div>




</body>

</html>
